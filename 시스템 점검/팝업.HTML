<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시스템 점검 안내</title>
<link rel="stylesheet" href="팝업.CSS">
<script src="팝업.js"></script>
</head>
<body>

        <div class="popup-wrap">
            <div class="background">

                
                <div class="warning-icon"><img src="img/warning.png" alt="경고"></div>
                <h1 class="title">시스템 점검 <span>일정 안내</span></h1>

                <div class="white-box">
                    <h3 class="subtitle">- 일정 안내 -</h3>

                    <div class="blue-card">
                        <p><b>점검 일시 : </b>2025년 12월 2일(화) 00:00 ~ 24:00</p>
                        <p class="detail">＊ <b class="detail-s">전면 중단 : </b>00:00 ~ 06:00</p>
                        <p class="detail">＊ <b class="detail-s">간헐적 중단 : </b>00:00 ~ 24:00</p>
                    </div>

                    <div class="blue-card">
                        <p><b>점검 내용 : </b> 서비스 안정화 및 보안 강화 작업</p>
                    </div>

                    <div class="blue-card">
                        <p><b>점검 대상 : </b>수소유통정보시스템(하잉, Hying) 모든 서비스</p>
                        <p class="detail">＊ 웹(Web), 앱(APP), 챗봇 등</p>
                    </div>

                    <p class="desc">
                        시스템 점검이 진행되어<br>
                        서비스 이용이 일시 중단됩니다.<br>
                        이용에 불편을 드려 죄송하며, 양해 부탁드립니다.
                    </p>

                    <div class="logo"><img src="img/logo.png" alt="수소유통정보시스템"></div>
                </div> 

                

            </div>
            <div class="person-img">
                <img src="img/man.png" alt="illustration">
            </div>
        </div>

        


</body>

</html>
